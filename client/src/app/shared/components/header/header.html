
<header class="site-header">
  <nav class="navbar">
    <a routerLink="/" class="logo">MEAN Ecommerce</a>

    <div class="nav-links">
      @if (auth.isAuthenticated()) {
        <span>Welcome, {{ auth.currentUser()?.name }}</span>
        <button type="button" (click)="logout()">
          Logout
        </button>
      } @else {
        <a routerLink="/login">Login</a>
        <a routerLink="/register" class="register-btn">
          Register
        </a>
      }
    </div>
  </nav>
</header>
